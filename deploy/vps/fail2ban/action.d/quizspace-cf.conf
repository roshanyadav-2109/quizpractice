# Also block the banned visitor at Cloudflare: proxied visitors reach the server from Cloudflare's addresses,
# so the server firewall alone cannot stop them. Needs /usr/local/sbin/quizspace-cf-ban (deploy/vps/cf-ban.sh).
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/quizspace-cf-ban ban <ip> "fail2ban <name> <time>"
actionunban = /usr/local/sbin/quizspace-cf-ban unban <ip>

[Init]
name = default
